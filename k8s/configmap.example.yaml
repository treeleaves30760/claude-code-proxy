apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-code-proxy-config
data:
  config.yaml: |
    default_model: proxy-default
    model_passthrough: false

    providers:
      openai:
        type: openai
        base_url: ${OPENAI_API_ENDPOINT:-https://api.openai.com/v1}
        api_key_env: OPENAI_API_KEY
        max_tokens_field: auto

      openrouter:
        type: openrouter
        base_url: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        headers:
          HTTP-Referer: ${OPENROUTER_SITE_URL:-}
          X-Title: ${OPENROUTER_APP_NAME:-claude-code-proxy}
        max_tokens_field: max_tokens

      ollama:
        type: ollama
        base_url: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
        api_key: ollama
        require_api_key: false
        max_tokens_field: max_tokens

    models:
      proxy-default:
        provider: openai
        model: gpt-5.5
        aliases:
          - claude-sonnet-4-6
          - claude-opus-4-7

      openrouter-gpt-5.5:
        provider: openrouter
        model: openai/gpt-5.5

      openrouter-claude-sonnet-4.6:
        provider: openrouter
        model: anthropic/claude-sonnet-4.6

      ollama-gpt-oss-20b:
        provider: ollama
        model: gpt-oss:20b

    public_models:
      - proxy-default
      - openrouter-gpt-5.5
      - openrouter-claude-sonnet-4.6
      - ollama-gpt-oss-20b
