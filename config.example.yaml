# Claude Code Proxy model routing config.
# Set MODEL_CONFIG_PATH=/app/config.yaml or mount this file as config.yaml.

default_model: proxy-default
model_passthrough: false

providers:
  openai:
    type: openai
    base_url: ${OPENAI_API_ENDPOINT:-https://api.openai.com/v1}
    api_key_env: OPENAI_API_KEY
    max_tokens_field: auto

  openrouter:
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: ${OPENROUTER_SITE_URL:-}
      X-Title: ${OPENROUTER_APP_NAME:-claude-code-proxy}
    max_tokens_field: max_tokens

  ollama:
    type: ollama
    base_url: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
    require_api_key: false
    api_key: ollama
    max_tokens_field: max_tokens

models:
  proxy-default:
    provider: openai
    model: gpt-5.5
    aliases:
      - claude-sonnet-4-6
      - claude-opus-4-7

  openai-gpt-5.5:
    provider: openai
    model: gpt-5.5

  openai-gpt-5.5-pro:
    provider: openai
    model: gpt-5.5-pro

  openrouter-gpt-5.5:
    provider: openrouter
    model: openai/gpt-5.5

  openrouter-claude-opus-4.7:
    provider: openrouter
    model: anthropic/claude-opus-4.7

  openrouter-claude-sonnet-4.6:
    provider: openrouter
    model: anthropic/claude-sonnet-4.6

  openrouter-gemini-3.5-flash:
    provider: openrouter
    model: google/gemini-3.5-flash

  openrouter-qwen3-coder-plus:
    provider: openrouter
    model: qwen/qwen3-coder-plus

  ollama-gpt-oss-20b:
    provider: ollama
    model: gpt-oss:20b

public_models:
  - proxy-default
  - openai-gpt-5.5
  - openai-gpt-5.5-pro
  - openrouter-gpt-5.5
  - openrouter-claude-opus-4.7
  - openrouter-claude-sonnet-4.6
  - openrouter-gemini-3.5-flash
  - openrouter-qwen3-coder-plus
  - ollama-gpt-oss-20b
